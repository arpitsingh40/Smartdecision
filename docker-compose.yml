services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017/smartdecision
      DB_NAME: smartdecision
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      CORS_ORIGINS: "*"
      FRONTEND_BASE_URL: http://localhost:3000
      TURN_COST: "5"
      SIGNUP_CREDITS: "100"
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
